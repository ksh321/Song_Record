plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ksh321.songrecord'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation('software.amazon.awssdk:s3:2.55.12') {
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client:2.55.12'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.9'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2:2.4.240'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
	lockAllConfigurations()
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging { exceptionFormat = 'full' }
}

// Local credential GUI passes secrets through stdin; this file contains paths only.
tasks.register('r2CheckerClasspath') {
    dependsOn tasks.named('classes')
    doLast {
        def target = rootProject.file('../../.local/workflow/cloudflare/checker-classpath.txt')
        target.parentFile.mkdirs()
        target.text = sourceSets.main.runtimeClasspath.asPath
    }
}

// Development-only synthetic deletion probe; credentials stay on stdin.
tasks.register('r2CleanupProbeClasspath') {
    dependsOn tasks.named('testClasses')
    doLast {
        def target = rootProject.file('../../.local/workflow/p13-06/checker-classpath.txt')
        target.parentFile.mkdirs()
        target.text = sourceSets.test.runtimeClasspath.asPath
    }
}
