# P01-04 local development profile.
# Secrets are injected at runtime and must not be committed.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:song_record}
spring.datasource.username=${DB_USER:song_record}
spring.datasource.password=${DB_PASSWORD}

# Schema changes belong to Flyway. P01-05 will enable migrations.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
