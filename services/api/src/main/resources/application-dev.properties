# P01-05 local development profile.
# Secrets are injected at runtime and must not be committed.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:song_record}
spring.datasource.username=${DB_USER:song_record}
spring.datasource.password=${DB_PASSWORD}

# Flyway is the only schema writer. Hibernate only validates mapped entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
