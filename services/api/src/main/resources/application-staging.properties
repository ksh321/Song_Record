# Validation deployment; dev/bootstrap must never be combined with this profile.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:song_record_validation}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USER:song_record_validation}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.com.ksh321.songrecord.api=INFO
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.ssl.enabled=true
server.ssl.key-store=file:/run/runtime/server.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.port=8443
songrecord.deployment.environment=staging
songrecord.storage.enabled=true
songrecord.storage.environment=dev
# Scheduling is opt-in after isolated storage and worker validation, not an API role feature.
songrecord.upload.scheduling-enabled=false
songrecord.account-deletion.worker.enabled=false

# Initial beta policy; existing entitlement overrides and data are preserved.
songrecord.operations.beta-accounts=${SONGRECORD_OPERATIONS_BETA_ACCOUNTS:20}
songrecord.operations.pinned-limit=${SONGRECORD_OPERATIONS_PINNED_LIMIT:10}
songrecord.operations.personal-bytes=${SONGRECORD_OPERATIONS_PERSONAL_BYTES:1000000000}
songrecord.operations.global-bytes=${SONGRECORD_OPERATIONS_GLOBAL_BYTES:20000000000}
songrecord.operations.daily-upload-bytes=${SONGRECORD_OPERATIONS_DAILY_UPLOAD_BYTES:104857600}
songrecord.operations.urls-per-minute=${SONGRECORD_OPERATIONS_URLS_PER_MINUTE:10}
songrecord.operations.upload-concurrency=${SONGRECORD_OPERATIONS_UPLOAD_CONCURRENCY:2}
songrecord.operations.temporary-bytes=${SONGRECORD_OPERATIONS_TEMPORARY_BYTES:536870912}
songrecord.operations.worker-concurrency=${SONGRECORD_OPERATIONS_WORKER_CONCURRENCY:2}
songrecord.operations.worker-seconds=${SONGRECORD_OPERATIONS_WORKER_SECONDS:60}
