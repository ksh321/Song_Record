# Validation deployment; dev/bootstrap must never be combined with this profile.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:song_record_validation}
spring.datasource.username=${DB_USER:song_record_validation}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.com.ksh321.songrecord.api=INFO
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.ssl.enabled=true
server.ssl.key-store=file:/run/runtime/server.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.port=8443
songrecord.deployment.environment=staging
songrecord.storage.enabled=true
songrecord.storage.environment=dev
# Scheduling is opt-in after isolated storage and worker validation, not an API role feature.
songrecord.upload.scheduling-enabled=false
songrecord.account-deletion.worker.enabled=false
