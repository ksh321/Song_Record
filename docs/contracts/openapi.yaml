openapi: 3.1.1
info:
  title: Song Record API
  version: 0.7.1
  description: P07-01 공통 계약. implemented=기존 인증 API, planned=후속 구현 목표. 문서의 planned
    경로는 현재 서버에서 제공되지 않는다. 인증 DTO는 호환성을 위해 camelCase, 업무 DTO는 snake_case를 사용한다. 문자열
    길이는 정규화 후 Unicode code point 수이며 메모는 CRLF/CR을 LF로 통일한다.
servers:
- url: /v1
security:
- BearerAuth: []
paths:
  /playlists:
    get:
      operationId: listPlaylists
      summary: 동일 계정의 활성 목록 조회 — 중복 이름 허용, 날짜 자동 초기화 없음
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: '계정별 ID 순서 페이지 — items/count/next_cursor, Cache-Control no-store'}
        '401': {$ref: '#/components/responses/Error401'}
    post:
      operationId: createPlaylist
      summary: 일반 플레이리스트 생성 — 같은 이름도 새 UUID로 생성 가능
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201': {description: 새 목록 — id/name/revision/deleted_at/updated_at}
        '200': {description: 동일 UUID의 기존 활성 목록 — 편집값 덮어쓰기 없음}
        '400': {$ref: '#/components/responses/Error400'}
        '409': {$ref: '#/components/responses/Error409'}
  /playlists/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    - $ref: '#/components/parameters/DeviceId'
    - $ref: '#/components/parameters/IdempotencyKey'
    patch:
      operationId: renamePlaylist
      summary: 목록 이름 변경 — 중복 이름 허용
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, base_revision]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                base_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: 이름 변경 후 목록 — revision 증가}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
    delete:
      operationId: deletePlaylist
      summary: D07 목록 영구 삭제 — 곡·녹음 보존
      x-implementation-status: implemented
      description: 삭제 UUID 원장·변경 로그·정리 Job을 원자적으로 저장한다. 같은 요청 재시도와 이미 삭제된 소유자 목록은 최초 삭제 결과를 반환한다. 본문 정리 후에도 삭제 원장은 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_revision]
              properties:
                base_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: 최소 삭제 결과 — id/status DELETED/revision/deleted_at}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /playlists/{id}/items:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: listPlaylistItems
      summary: 동일 계정 목록의 전체 활성 항목과 부모 버전 조회
      x-implementation-status: implemented
      responses:
        '200': {description: 'playlist 헤더(created_at 포함)와 전체 items 배열 — position 순서'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
    post:
      operationId: addRegisteredPlaylistItem
      summary: 활성 TJ·직접 등록 내 곡 추가 — 서버가 entry_key·ID·위치 계산
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [song_id, base_revision]
              properties:
                song_id: {type: string, format: uuid}
                base_revision: {type: integer, minimum: 1}
      responses:
        '201': {description: 'created true·item_id·playlist·items, 부모 revision 1 증가'}
        '200': {description: '같은 키의 기존 item_id·position 반환, created false·부모 revision/변경 순서 불변'}
        '400': {$ref: '#/components/responses/Error400'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /charts/popular:
    get:
      operationId: getPopularChart
      summary: D12 브랜드·기간별 마지막 정상 인기곡 게시본 조회
      description: 게시본만 읽고 사용자 요청에서 제공자를 호출하지 않는다. 같은 조건의 수집 실패/진행 중에는 stale=true. 게시본이 없으면 503 CHART_SOURCE_UNAVAILABLE. 정확한 집계 날짜는 미제공. TJ만 24시간 source_token을 발급하고 KY는 null이다. Cache-Control no-store.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/RequestId'
      - name: brand
        in: query
        required: true
        schema: {type: string, enum: [TJ, KY]}
      - name: period
        in: query
        required: true
        schema: {type: string, enum: [DAILY, WEEKLY, MONTHLY]}
      responses:
        '200':
          description: 동일 조건의 전체 게시본. 수집 시각은 제공자 갱신 시각이 아니다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [brand, period, provider, source_url, fetched_at, revision, stale, items]
                properties:
                  brand: {type: string, enum: [TJ, KY]}
                  period: {type: string, enum: [DAILY, WEEKLY, MONTHLY]}
                  provider: {type: string, const: MANANA}
                  source_url: {type: string, format: uri}
                  fetched_at: {type: string, format: date-time}
                  revision: {type: integer, format: int64, minimum: 1}
                  stale: {type: boolean}
                  items:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [position, number, title, artist, source_token]
                      properties:
                        position: {type: integer, minimum: 1}
                        number: {type: string, pattern: '^[0-9]{1,20}$'}
                        title: {type: string, minLength: 1, maxLength: 200}
                        artist: {type: string, minLength: 1, maxLength: 200}
                        source_token: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '503': {$ref: '#/components/responses/Error503'}
  /pins/{slotNo}/replacement:
    post:
      operationId: replacePin
      summary: 같은 슬롯에서 기존 고정을 보호하며 교체 대기
      description: current를 유지하고 pending만 추가하며 점유 슬롯 수는 늘리지 않는다. base_revision과 소유 계정을 확인한다. 이미 STORED인 대상은 같은 트랜잭션에서 확정하고 나머지는 업로드 확정 후 전환한다. 업로드는 기존 used+reserved 용량 제한을 따른다. 다른 pending을 덮어쓰지 않는다. Cache-Control no-store.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - name: slotNo
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 2147483647}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recording_id, base_revision]
              properties:
                recording_id: {type: string, format: uuid}
                base_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 기존 current와 새 pending을 가진 동일 슬롯. 동일 대상은 현재 상태 반환.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PinSlot'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /pins/{slotNo}/replacement/cancel:
    post:
      operationId: cancelPinReplacement
      summary: 교체 대기만 취소하고 기존 고정 유지
      description: 인증 소유 계정과 슬롯 base_revision을 확인한다. pending만 비우며 current·다른 자동 역할·실제 파일을 삭제하지 않는다. 업로드 실패 정리도 당시 고정 요청 ID가 일치해야 한다. Cache-Control no-store.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - name: slotNo
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 2147483647}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_revision]
              properties:
                base_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: current를 유지하고 pending이 없는 슬롯. 이미 비어 있으면 현재 상태 반환.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PinSlot'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /pins/{slotNo}:
    delete:
      operationId: releasePin
      summary: 고정 또는 대기 고정 해제
      description: 슬롯 버전을 확인하고 current와 pending을 해제한다. 파일·자동 역할·보존 사유를 삭제하지 않는다. 교체의 pending만 취소하려면 replacement/cancel을 사용한다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - name: slotNo
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 2147483647}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_revision]
              properties:
                base_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 비워진 슬롯. 슬롯 행과 증가한 버전은 유지한다. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PinSlot'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /recordings/{id}/playback-url:
    post:
      operationId: issuePlaybackUrl
      summary: 본인 소유 녹음의 내부 재생 URL
      description: 인증 계정의 ACTIVE 녹음과 현재 STORED 세대만 5분 GET URL로 제공한다. 공개 공유 링크가 아니며 이미 발급된 주소는 만료까지 유효할 수 있다. 서버 파일 부재·타인·삭제 상태는 AUDIO_UNAVAILABLE로 주소를 반환하지 않는다. 클라이언트는 기대 객체의 전체 식별자와 바이트 체크섬을 대조한다. Cache-Control no-store.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 현재 서버 객체 식별자와 짧은 다운로드 URL. URL·키는 로그에 기록하지 않는다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, recording_id, generation, sha256, size_bytes, cloud_revision, url, expires_at]
                properties:
                  user_id: {type: string, format: uuid}
                  recording_id: {type: string, format: uuid}
                  generation: {type: string, format: uuid}
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  size_bytes: {type: integer, format: int64, minimum: 1, maximum: 6291456}
                  cloud_revision: {type: integer, format: int64, minimum: 1}
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /recordings/{id}/preservation-url:
    get:
      operationId: getPreservationUrl
      summary: 로컬 보존 확인용 서버 사본 다운로드
      description: 인증 계정의 현재 STORED 세대만 5분 GET URL로 제공한다. URL은 보존 확인 토큰이 아니며 삭제를 승인하지 않는다. 클라이언트는 기대 객체의 전체 식별자와 바이트 체크섬을 대조한다. Cache-Control no-store.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 현재 서버 객체 식별자와 짧은 다운로드 URL. URL·키는 로그에 기록하지 않는다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, recording_id, generation, sha256, size_bytes, cloud_revision, url, expires_at]
                properties:
                  user_id: {type: string, format: uuid}
                  recording_id: {type: string, format: uuid}
                  generation: {type: string, format: uuid}
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  size_bytes: {type: integer, format: int64, minimum: 1, maximum: 6291456}
                  cloud_revision: {type: integer, format: int64, minimum: 1}
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /recordings/{id}/retention:
    get:
      operationId: getRecordingRetention
      summary: 자동 역할·고정·보존 사유와 실제 서버 파일 조회
      description: 서버의 현재 보관 상태만 반환한다. 기기 파일 유무를 추정하지 않으며 녹음 정보만으로 stored를 참으로 표시하지 않는다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/RequestId'
      - name: X-Cleanup-Confirmation-Id
        in: header
        required: false
        description: 로컬 보호 복구를 위한 본인 확인 ID. URL에 넣지 않으며 같은 계정·녹음의 결과만 반환한다.
        schema: {type: string, format: uuid}
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 동일 DB 읽기 시점의 계정 소유 녹음 상태. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordingRetention'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
  /storage/cleanup-previews:
    post:
      operationId: previewCleanup
      summary: 현재 정리 가능한 서버 세대별 15분 확인 토큰
      description: 최신 자동 역할·고정·교체 보호를 대조하고 각 객체에 임의 토큰을 발급한다. 계정·generation·sha256·cloud_revision과 발급 시각에 묶이며 중복 요청은 만료를 연장하지 않는다. 전부 성공하거나 전부 롤백한다. 파일 삭제나 용량 확보를 약속하지 않는다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recording_ids]
              properties:
                recording_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: 세대별 확인 토큰과 객체. Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CleanupPreview'}}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /storage/cleanup-confirmations:
    post:
      operationId: confirmCleanup
      summary: 로컬 보존 확인 또는 명시적 서버 사본 손실 확인
      description: token 소유 계정·기기·현재 세대·체크섬·revision·15분 만료·보호를 재검사한다. LOCAL_VERIFIED 전 앱이 실제 영속 파일을 확인하고 cleanup_fence를 저장한다. USER_CONFIRMED_LOSS는 별도 손실 확인 true가 필수다. 이 응답은 CONFIRMED이며 삭제 시작·used 차감은 하지 않는다. 오래된 멱등 응답도 삭제 전 유효성 검사를 대체하지 않는다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                additionalProperties: false
                required: [token, mode, device_id, sha256]
                properties:
                  token: {type: string, format: uuid}
                  mode: {const: LOCAL_VERIFIED}
                  device_id: {type: string, format: uuid}
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
              - type: object
                additionalProperties: false
                required: [token, mode, device_id, sha256, understands_loss]
                properties:
                  token: {type: string, format: uuid}
                  mode: {const: USER_CONFIRMED_LOSS}
                  device_id: {type: string, format: uuid}
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  understands_loss: {const: true}
      responses:
        '200':
          description: 확인 상태. 만료·응답 유실 시 로컬 보호를 자동 해제하지 않는다. Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, state, expires_at]
                properties:
                  token: {type: string, format: uuid}
