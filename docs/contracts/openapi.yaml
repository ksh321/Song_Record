              $ref: '#/components/schemas/KeyMode'
            key_shift:
              $ref: '#/components/schemas/KeyShift'
            version_code:
              $ref: '#/components/schemas/VersionCode'
      - if:
          required:
          - key_mode
          properties:
            key_mode:
              const: ORIGINAL
        then:
          required:
          - key_shift
          properties:
            key_shift:
              const: 0
