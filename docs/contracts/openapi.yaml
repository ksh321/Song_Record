      description: P09-01 DRAFT만 구현. 빈 제목/가수는 null, note null/누락은 빈 문자열, 버전 누락은 NORMAL.
        키는 둘 다 null/누락 또는 유효한 쌍. 파일 명세·SAVED·태그·컨디션·티어는 후속 단계이며 현재 거절.
