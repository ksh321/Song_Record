    KeyShift:
      type: integer
      minimum: -12
      maximum: 12
    TagIds:
      type: array
      items:
        $ref: '#/components/schemas/Uuid'
      uniqueItems: true
    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 8192
      description: 내용을 해석하거나 직접 구성하지 않는다. 계정·조회 종류·필터·정렬·키 규격·limit에 결합한다. 불일치나 변조는
        400 INVALID_CURSOR, 조회 세대 변경 또는 만료는 409 LIST_CURSOR_EXPIRED로 첫 페이지 재조회를 요구한다.
        목록 커서 수명은 발급 후 30분이며 동기화 스냅샷을 뜻하지 않는다.
    AuthProof:
      type: string
      minLength: 1
