      enum:
      - NORMAL
      - MR
      - LIVE
    KeyMode:
      type: string
      enum:
      - ORIGINAL
      - MALE
      - FEMALE
    SongTier:
      type: string
      enum:
      - S
      - A
      - B
      - C
      - D
    RecordingTier:
      type: string
      enum:
      - S
      - A
      - B
      - C
      - D
    MetadataState:
      type: string
      enum:
      - DRAFT
      - SAVED
    LifecycleState:
