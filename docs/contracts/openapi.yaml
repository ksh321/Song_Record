openapi: 3.1.1
info:
  title: Song Record API
  version: 0.7.1
  description: P07-01 공통 계약. implemented=기존 인증 API, planned=후속 구현 목표. 문서의 planned 경로는 현재 서버에서 제공되지 않는다. 인증 DTO는
    호환성을 위해 camelCase, 업무 DTO는 snake_case를 사용한다. 문자열 길이는 정규화 후 Unicode code point 수이며 메모는 CRLF/CR을 LF로 통일한다.
servers:
- url: /v1
security:
- BearerAuth: []
paths:
  /auth/social:
    post:
      operationId: socialLogin
      summary: socialLogin
      description: GOOGLE ID token / KAKAO access token 검증 후 200. 로그인마다 서버가 기기 ID를 발급한다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: refreshSession
      description: 기기 귀속 refresh proof로 토큰 회전. 이전 토큰 재사용 금지. Bearer access token 불필요.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/logout:
    post:
      operationId: logoutSession
      summary: logoutSession
      description: 현재 기기에 귀속된 세션만 폐기. 같은 proof 재시도 가능. 다른 세션과 로컬 자료 유지.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/me:
    get:
      operationId: getCurrentSession
      summary: getCurrentSession
      description: 현재 구현된 인증 계약.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/identities:
    get:
      operationId: listIdentities
      summary: listIdentities
      description: 현재 구현된 인증 계약.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/identities/reauth-challenges:
    post:
      operationId: beginIdentityReauthentication
      summary: beginIdentityReauthentication
      description: 현재 구현된 인증 계약.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkChallenge'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkBegin'
  /auth/identities/link-challenges:
    post:
      operationId: verifyExistingIdentity
      summary: verifyExistingIdentity
      description: 현재 구현된 인증 계약.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkChallenge'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkProof'
  /auth/identities/link:
    post:
      operationId: linkIdentity
      summary: linkIdentity
      description: 현재 구현된 인증 계약.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResult'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkProof'
  /auth/identities/{identityId}/unlink:
    post:
      operationId: unlinkIdentity
      summary: unlinkIdentity
      description: '현재 구현: Bearer + X-Device-Id, 본문 없음(앱은 {} 전송). 마지막 수단은 LAST_IDENTITY_REQUIRED. 설계서의 재인증/base_revision
        요청은 아직 미구현이며 docs/contracts/P07-01-api-contract.md의 차이 목록에 기록한다.'
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - name: identityId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlinkResult'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /songs:
    get:
      operationId: listSongs
      summary: listSongs
      description: P08-05b 구현. 인증 계정의 ACTIVE 곡에서 제목·가수 부분 검색, 5개 정렬과 티어별 보기. 최근 녹음은 ACTIVE·SAVED만 계산하며 파일 유무는 무관하다. 결과가 바뀌면 기존 커서는 409 LIST_CURSOR_EXPIRED다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
        description: 앞뒤 계약 공백 제거·NFC·ASCII 소문자화 후 제목 또는 가수의 문자 그대로 부분 일치. 빈 값은 전체.
      - name: sort
        in: query
        schema:
          type: string
          enum: [ADDED_DESC, RECORDED_DESC, TIER, TITLE, ARTIST]
          default: ADDED_DESC
      - name: view
        in: query
        schema:
          type: string
          enum: [ALL, TIER_GROUPED]
          default: ALL
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      operationId: createSong
      summary: createSong
      description: P08-04 TJ·MANUAL 생성 구현. TJ는 검증된 후보와 출처 원본을 저장한다. MANUAL은 사용자 확인 사유 TJ_NOT_FOUND와 곡명·가수를 요구하며 외부 후보 검증을 호출하지 않는다. TJ 후보 검증 장애는 503으로 유지하고 MANUAL로 자동 전환하지 않는다. P08-08 같은 번호의 TRASHED는 SONG_RESTORE_REQUIRED, PURGE_PENDING은 SONG_PURGE_PENDING(409)이며 details에 canonical_song_id·current_revision·lifecycle_state를 제공한다. PURGED UUID 및 삭제 원장의 UUID는 RESOURCE_PURGED로 거절하고 같은 번호는 새 UUID로만 등록한다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongCreateResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '200':
          description: 동일 TJ 번호 또는 동일 생성 UUID의 기존 곡. 편집값으로 덮어쓰지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongCreateResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongCreate'
  /songs/{id}:
    get:
      operationId: getSong
      summary: getSong
      description: 후속 단계 구현 대상.
      x-implementation-status: planned
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      operationId: patchSong
      summary: patchSong
      description: P08-06 구현. base_revision으로 충돌을 검사하고 곡·검색 키·변경 기록을 같은 트랜잭션에서 수정한다. 과거 녹음과 TJ 출처 원본은 유지한다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongPatch'
  /recordings:
    get:
      operationId: listRecordings
      summary: listRecordings
      description: P09-03b DB 목록 조회 구현. 필터 적용 후 정확한 count와 keyset 페이지를 같은 읽기 스냅샷에서 반환. ACTIVE 메타정보는 파일 존재와 무관하게 기본 포함하며 DRAFT/SAVED 필터를 별도 제공한다. 기간은 UTC from 포함·to 제외, 태그는 모두 일치, 최종 동률은 UUID 오름차순. 로컬 파일 유무는 서버에서 추정하지 않는다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: from
        in: query
        required: false
        description: UTC 기간 경계. from 포함/to 제외. 둘 다 있으면 from < to. MySQL 1000~9999년 범위.
        schema:
          $ref: '#/components/schemas/UtcInstant'
      - name: to
        in: query
        required: false
        description: UTC 기간 경계. from 포함/to 제외. 둘 다 있으면 from < to. MySQL 1000~9999년 범위.
        schema:
          $ref: '#/components/schemas/UtcInstant'
      - name: song_id
        in: query
        required: false
        description: 정규 소문자 UUID는 해당 곡, UNLINKED는 미연결. 누락은 전체.
        schema:
          type: string
      - name: key_mode
        in: query
        required: false
        description: 키 모드. 반음 필터와 독립적으로 지정 가능.
        schema:
          type: string
          enum:
          - ORIGINAL
          - MALE
          - FEMALE
      - name: key_shift
        in: query
        required: false
        description: 반음 이동 값.
        schema:
          type: integer
          minimum: -12
          maximum: 12
      - name: version_code
        in: query
        required: false
        description: 녹음의 버전. 곡 버전과 독립.
        schema:
          $ref: '#/components/schemas/VersionCode'
      - name: tier
        in: query
        required: false
        description: 녹음 티어. NONE=미정, ALL/누락=전체.
        schema:
          type: string
          enum:
          - ALL
          - S
          - A
          - B
          - C
          - D
          - NONE
      - name: condition_code
        in: query
        required: false
        description: /conditions의 code. 기존 기본 코드 또는 사용자 UUID. NONE=미지정, ALL/누락=전체.
        schema:
          anyOf:
          - $ref: '#/components/schemas/ConditionReference'
          - type: string
            enum: [ALL, NONE]
      - name: tag_ids
        in: query
        required: false
        description: 정규 소문자 UUID를 쉼표로 구분, 최대 20개. 모두 가진 녹음만 포함. 순서/중복은 정규화.
        schema:
          type: string
      - name: server_file
        in: query
        required: false
        description: 서버 사본 존재 여부. 업로드 대기나 로컬 파일 유무와 구분한다. ALL/누락은 파일 없는 메타정보도 포함.
        schema:
          type: string
          enum:
          - ALL
          - PRESENT
          - ABSENT
      - name: metadata_state
        in: query
        required: false
        description: 기본 ALL은 입력 대기 DRAFT도 포함.
        schema:
          type: string
          enum:
          - ALL
          - DRAFT
          - SAVED
      - name: sort
        in: query
        required: false
        description: TITLE은 녹음 제목 snapshot과 공통 자연 정렬 사용, 빈 제목 마지막. TIER는 S→A→B→C→D→미정 및
          최신순. 최종 동률 UUID 오름차순.
        schema:
          type: string
          enum:
          - RECORDED_DESC
          - RECORDED_ASC
          - TITLE
          - TIER
          default: RECORDED_DESC
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      operationId: createRecording
      summary: createRecording
