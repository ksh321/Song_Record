            schema:
              $ref: '#/components/schemas/RecordingPatch'
  /songs/{id}/representative:
    put:
      operationId: setRepresentative
      summary: setRepresentative
      description: 같은 계정·같은 곡의 ACTIVE·SAVED 녹음 지정. recording_id null은 해제. 소유권 불일치·없는 자료는 404, 소유한 녹음의 곡/상태 부적합은 409 REPRESENTATIVE_NOT_ELIGIBLE. base_revision 검사와 멱등 처리를 적용하며 녹음 메타데이터는 변경하지 않는다.
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
