      operationId: setRecordingTier
      summary: setRecordingTier
      description: 후속 단계 구현 대상.
      x-implementation-status: planned
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
