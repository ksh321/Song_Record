:root{color-scheme:dark;--bg:#111111;--surface:#232323;--raised:#303030;--line:#383838;--text:#e7e7e7;--muted:#a8a8a8;--accent:#2c67c5;--on-accent:#fff;--danger:#e7a2a2}

/* Shared source tokens and font remain authoritative. */
.phone{position:relative}
.phone .review-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 6px}
.phone .review-choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:156px;padding:18px 16px;background:var(--surface);border:1px solid #454545;border-radius:18px;text-align:left;color:var(--text)}
.phone .review-choice-icon{display:grid;place-items:center;width:38px;height:38px;background:var(--raised);border-radius:11px;color:var(--text)}
.phone .review-choice strong{font-size:15px;color:var(--text);line-height:1.5}
.phone .review-choice small{font-size:11px;line-height:1.65;color:var(--muted);margin-top:-6px;word-break:keep-all}
.phone .review-choice-arrow{position:absolute;right:18px;top:26px;color:var(--muted)}
.phone .review-overlay{position:absolute;inset:0;background:#0009;z-index:5;display:flex;align-items:flex-end}
.phone .review-sheet{width:100%;padding:12px 24px 28px;background:#202020;border:1px solid #3b3b3b;border-radius:24px 24px 0 0}
.phone .review-sheet-handle{width:38px;height:4px;margin:0 auto 15px;background:#5b5b5b;border-radius:4px}
.phone .review-sheet-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.phone .review-sheet-heading h3{margin:0;font-size:18px;color:var(--text)}
.phone .review-sheet-heading button{border:0;background:transparent;color:var(--muted);min-height:44px;padding:0 0 0 10px;font-size:12px}
.phone .review-sheet-caption{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
.phone .review-inline{width:100%;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 2px;background:transparent;color:var(--text);border:0;border-top:1px solid #333;border-bottom:1px solid #333;font-size:12px;text-align:left;margin-top:18px}
.phone .review-inline>svg{flex-shrink:0;color:var(--muted)}
.phone .review-inline>span{flex:1}
.phone .review-inline small{font-size:11px;color:var(--muted)}
.phone .review-query{min-height:48px;width:100%;display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;text-align:left;padding:11px 14px;font-size:14px;line-height:1.5}
.phone .review-query>span{flex:1}
.phone .review-query>svg{flex-shrink:0;color:var(--muted)}
.phone[data-review-layout="library"] .phone-body{gap:0}
.phone[data-review-layout="library"] .options{margin-top:16px}
.phone[data-review-layout="library"] .compact-row{min-height:66px;margin:0;padding:12px;gap:12px}
.phone[data-review-layout="library"] .compact-copy strong{font-size:15px;line-height:1.45;color:var(--text)}
.phone[data-review-layout="library"] .compact-copy{min-width:0}
.phone[data-review-layout="library"] .compact-copy small{line-height:1.5;margin-top:5px}
.phone[data-review-layout="library"] .tier{flex-shrink:0;min-width:30px}
.phone[data-review-layout="library"] .key{white-space:nowrap;flex-shrink:0;min-width:44px;text-align:center}
.phone[data-review-layout="library"] .section-label{margin:18px 0 8px 2px;font-size:12px}
.phone[data-review-layout="library"] .review-tools+.section-label{margin-top:0}
.phone[data-review-layout="library"] .command{margin-top:20px}
.phone .review-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px}
.phone .review-tools>small{color:var(--muted);font-size:11px}
.phone .review-tools button{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--text);padding:0 2px 0 10px;min-height:44px;font-size:12px}
.phone .review-tools button svg{color:var(--muted)}
.phone .review-sort-option{width:100%;min-height:51px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;padding:10px 12px;background:transparent;border:0;border-radius:9px;color:var(--text);font-size:14px;text-align:left}
.phone .review-sort-option.selected{background:var(--raised)}
.phone .review-context{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 3px}
.phone .review-search-panel{display:flex;flex-direction:column;gap:16px;margin-bottom:10px}
.phone .review-brand-tabs{display:flex;align-items:center;gap:25px;border-bottom:1px solid #333}
.phone .review-brand-tabs button{font-size:15px;min-height:44px;background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:6px 8px 12px}
.phone .review-brand-tabs button.selected{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.phone .review-brand-label{color:var(--text);font-size:14px;font-weight:700;line-height:1.5}
.phone .review-search-types{display:flex;gap:8px}
.phone .review-search-types button{padding:7px 15px;border:1px solid var(--line);border-radius:18px;background:transparent;color:var(--muted);font-size:12px;min-height:36px}
.phone .review-search-types button.selected{background:var(--raised);color:var(--text);border-color:#5b5b5b}
.phone .review-search-result{display:flex;align-items:center;gap:14px;min-height:72px;width:100%;padding:14px 2px;border:0;border-bottom:1px solid #333;background:transparent;text-align:left;color:var(--text)}
.phone .review-result-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.phone .review-result-copy strong{font-size:15px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.phone .review-result-copy small{font-size:11px;line-height:1.5;color:var(--muted)}
.phone .review-search-hint{padding:60px 0 25px;text-align:center}
.phone .review-search-hint strong{font-size:16px;line-height:1.6;color:var(--text)}
.phone .review-search-hint p{font-size:12px;line-height:1.8;color:var(--muted);margin:12px 0 0}
.phone .review-period{display:flex;align-items:center;gap:8px;padding:0 1px;border:0;background:transparent;color:var(--text);min-height:44px;font-size:13px}
.phone .review-ranked{display:flex;align-items:center;gap:12px;min-height:70px;width:100%;padding:12px 0;border:0;border-bottom:1px solid #333;background:transparent;text-align:left;color:var(--text);margin-bottom:-12px}
.phone .review-rank{width:30px;flex-shrink:0;text-align:center;font-size:21px;font-variant-numeric:tabular-nums;color:var(--muted)}
.phone .review-rank.top{font-size:25px;font-weight:700;color:var(--text)}
.phone .review-result-number{font-size:10px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
@media(pointer:coarse){.phone .review-search-types button{min-height:44px}}

.phone .song-meta-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.phone .song-meta-heading h3{margin:0;color:var(--muted);font-size:12px;font-weight:500}

.phone .song-meta dl>div{min-width:0;padding:0 12px;border-left:1px solid #414141}
.phone .song-meta dl>div:first-child{padding-left:0;border-left:0}

.phone .song-meta dt{color:var(--muted);font-size:11px;margin:0 0 9px}
.phone .song-meta dd{color:var(--text);font-size:15px;font-weight:600;margin:0;line-height:1.5;white-space:nowrap}

.phone .control-sheet{width:100%;max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:#232323;border:1px solid #414141;border-bottom:0;border-radius:25px 25px 0 0;padding:12px 24px 28px;box-shadow:0 -8px 30px #0003;animation:control-sheet-in .18s ease-out}
.phone .control-handle{width:38px;height:4px;background:#626262;border-radius:4px;margin:0 auto 12px}
.phone .control-sheet-header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}
.phone .control-sheet-header h3{font-size:19px;color:var(--text);line-height:1.5;margin:0}
.phone .control-close{min-width:44px;min-height:44px;color:var(--muted);border:0;background:transparent;font-size:12px;padding:0;text-align:right}
.phone .control-caption{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 12px}
.phone .control-options{display:flex;flex-direction:column;margin-top:8px}

  function allLinks(s){return [...s.blocks.flatMap(b=>b.to?[{label:b.label||b.title,to:b.to}]:(b.items||[]).filter(x=>x.to)),...(s.back?[{label:'이전 화면',to:s.back}]:[])];}
  function aside(){return '<p class="eyebrow">검수 시나리오</p>'+P.scenarios.map(([n,id,d])=>'<button class="scenario '+(id===current?'active':'')+'" data-jump="'+id+'"><span>'+R.esc(n)+'</span><small>'+R.esc(d)+'</small></button>').join('');}
  function inspector(s){return '<section><h2>이번 화면의 로직</h2><div class="state-id">'+R.esc(s.id)+'</div><p>'+R.esc(s.rule)+'</p><h3>강조색</h3><div class="legend">'+P.palettes.map(([n,c],i)=>'<button title="'+n+' '+c+'" style="--swatch:'+c+'" data-accent="'+i+'" aria-label="'+n+'"></button>').join('')+'</div><h3>버튼 연결</h3><div class="outgoing">'+allLinks(s).map(l=>'<button data-to="'+l.to+'">'+R.esc(l.label)+' → '+R.esc(map.get(l.to).name)+'</button>').join('')+'</div></section><section><h3>이동 기록</h3><ol class="path-log">'+history.slice(-6).concat(current).map((id,i)=>'<li>'+String(i+1).padStart(2,'0')+' · '+R.esc(map.get(id).name)+'</li>').join('')+'</ol><p class="disclaimer">'+P.notice+'<br><br>곡명·가수·노래방 번호·보관 수치는 검수용 가상 데이터입니다.</p></section>';}
  function prototype(){const s=map.get(current);$('.sidebar').innerHTML=aside();$('.inspector').innerHTML=inspector(s);$('.stage').innerHTML='<div class="stage-toolbar"><span>'+R.esc(s.group)+' / '+String(P.screens.indexOf(s)+1).padStart(3,'0')+'</span><button data-hotspots title="클릭 영역 표시">'+(hotspots?'클릭 영역 숨기기':'클릭 영역')+'</button></div><div class="device-holder">'+R.phone(s)+'</div>';if(hotspots)$('.phone').classList.add('hotspots');}
  function gallery(){const groups=[...new Set(P.screens.map(s=>s.group))];const visible=P.screens.filter(s=>(group==='all'||s.group===group)&&(!filter||(s.name+' '+s.id+' '+s.rule).toLowerCase().includes(filter.toLowerCase())));$('.stage').innerHTML='<div class="gallery-controls"><input id="filter" aria-label="화면 검색" placeholder="화면 이름 또는 로직 검색" value="'+R.esc(filter)+'"><select id="group" aria-label="화면 그룹"><option value="all">전체 그룹</option>'+groups.map(g=>'<option '+(group===g?'selected':'')+'>'+R.esc(g)+'</option>').join('')+'</select><span>'+visible.length+' / '+P.screens.length+' 화면·상태</span></div>'+groups.map(g=>{const subset=visible.filter(s=>s.group===g);return !subset.length?'':'<section class="gallery-group"><h2>'+R.esc(g)+'</h2><div class="gallery-grid">'+subset.map(s=>'<article class="tile"><div class="tile-heading"><span>'+String(P.screens.indexOf(s)+1).padStart(3,'0')+' · '+R.esc(s.name)+'</span><button data-jump="'+s.id+'">열기</button></div><div class="scaled">'+R.phone(s,false)+'</div><p class="tile-caption">'+R.esc(s.rule)+'</p></article>').join('')+'</div></section>';}).join('');scaleTiles();}
  function coverage(){document.querySelector('.stage').innerHTML='<div class="coverage"><h2>설계서 v1.11 로직 검수</h2><p>'+R.esc(P.notice)+'</p><table><thead><tr><th>시나리오</th><th>확인할 규칙</th><th>시작</th></tr></thead><tbody>'+P.scenarios.map(([n,id,d])=>'<tr><td>'+R.esc(n)+'</td><td>'+R.esc(d)+'</td><td><button data-jump="'+id+'">검수</button></td></tr>').join('')+'</tbody></table></div>';}
  function scaleTiles(){document.querySelectorAll('.scaled').forEach(el=>el.style.setProperty('--scale',(el.clientWidth/390).toFixed(6)));}
  function render(){document.body.className=mode==='prototype'?'':'view-gallery';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));if(mode==='prototype')prototype();else if(mode==='gallery')gallery();else coverage();setAccent(accent);R.prepareDialogs(document);EDIT_UI.afterRender(go,render,current);}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.to)go(b.dataset.to);else if(b.dataset.jump)go(b.dataset.jump,true);else if(b.dataset.mode){mode=b.dataset.mode;render();}else if(b.dataset.accent!==undefined)setAccent(b.dataset.accent);else if(b.hasAttribute('data-reset'))go(P.start,true);else if(b.hasAttribute('data-hotspots')){hotspots=!hotspots;render();}});
  document.addEventListener('change',e=>{if(e.target.id==='group'){group=e.target.value;gallery();}});
  let debounce;document.addEventListener('input',e=>{if(e.target.id==='filter'){filter=e.target.value;clearTimeout(debounce);debounce=setTimeout(()=>{const pos=e.target.selectionStart;gallery();const el=$('#filter');el.focus();el.setSelectionRange(pos,pos);},180);}});
  window.addEventListener('resize',scaleTiles);
  window.addEventListener('popstate',event=>{const stack=event.state?.bplayStack;const id=new URLSearchParams(location.hash.slice(1)).get('screen');if(Array.isArray(stack)&&stack.length){FLOW.nav.entries=stack;go(stack[stack.length-1].id,false,{restore:true})}else if(id&&FLOW.screenMap.has(id))go(id,true,{restore:true})});
  const seed=new URLSearchParams(location.hash.slice(1)).get('screen');if(map.has(seed))current=seed;
  try{accent=Number(localStorage.getItem('b-logic-accent'))||0}catch{}
  $('.brand-mark').innerHTML=R.icon('music',20);
  $('#screen-count').textContent=P.screens.length+' 화면·상태 · 설계서 v1.11';FLOW.current=current;FLOW.nav.visit(current,{reset:true});window.history.replaceState({bplayStack:FLOW.nav.entries},'',location.href);render();
  window.Prototype={go,back,returnTo,render,map,links:allLinks,get state(){return {screen:current,mode,accent,history:history.slice()}}};
})();
</script></body></html>
