name: API contract

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!apps/**"
      - "!services/**"
      - "!infra/**"
      - "!docs/**"
      - "!*.md"
      - "!tools/**"
      - "!.gitmessage.txt"
      - "docs/contracts/**"
      - "infra/scripts/verify_api_contract.py"
      - "infra/scripts/requirements-api-contract.txt"
      - ".github/workflows/**"
      - "tools/ci-policy.json"
      - "tools/ci-scope.ps1"
      - "tools/ci-event-scope.ps1"
      - "tools/github-check.ps1"
      - "tools/workflow-common.ps1"
  pull_request:
    paths:
      - "**"
      - "!apps/**"
      - "!services/**"
      - "!infra/**"
      - "!docs/**"
      - "!*.md"
      - "!tools/**"
      - "!.gitmessage.txt"
      - "docs/contracts/**"
      - "infra/scripts/verify_api_contract.py"
      - "infra/scripts/requirements-api-contract.txt"
      - ".github/workflows/**"
      - "tools/ci-policy.json"
      - "tools/ci-scope.ps1"
      - "tools/ci-event-scope.ps1"
      - "tools/github-check.ps1"
      - "tools/workflow-common.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create isolated contract validator
        run: |
          python3 -m venv .contract-venv
          .contract-venv/bin/python -m pip install -r infra/scripts/requirements-api-contract.txt
      - name: Validate OpenAPI and positive/negative wire examples
        run: .contract-venv/bin/python infra/scripts/verify_api_contract.py
