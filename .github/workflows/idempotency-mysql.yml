name: Idempotency MySQL

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!apps/**"
      - "!docs/**"
      - "!*.md"
      - "!tools/**"
      - "!.gitmessage.txt"
      - "!.github/**"
      - "docs/contracts/**"
  pull_request:
    paths:
      - "**"
      - "!apps/**"
      - "!docs/**"
      - "!*.md"
      - "!tools/**"
      - "!.gitmessage.txt"
      - "!.github/**"
      - "docs/contracts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify receipt atomicity and concurrent replay on MySQL
        working-directory: services/api
        env:
          P07_MYSQL_CI: 'true'
          P07_MYSQL_PASSWORD: disposable-ci-password
        run: bash gradlew test --tests '*MySqlIdempotencyTests' --tests '*MySqlSnapshotReadViewTests' --tests '*MySqlSnapshotBuildStoreTests' --tests '*MySqlSnapshotSourceRowsTests' --tests '*MySqlChangeReadViewTests' --no-daemon
